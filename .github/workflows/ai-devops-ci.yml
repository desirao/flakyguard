name: FlakyGuard AI-DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-triage:
    name: Lint, Test & FlakyGuard Triage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite with Coverage
        id: pytest_run
        run: |
          pytest -v --cov=app --cov=tools --cov=llm tests/ | tee pytest_output.log

      - name: FlakyGuard Incident Triage Trigger on Failure
        if: failure()
        env:
          FLAKYGUARD_URL: ${{ secrets.FLAKYGUARD_URL || 'https://flakyguard.demo.local' }}
          FLAKYGUARD_SECRET: ${{ secrets.FLAKYGUARD_WEBHOOK_SECRET || 'flakyguard-ci-hmac-secret-test' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "CI Failure detected! Formatting HMAC-signed payload for FlakyGuard-AI..."
          
          # Extract last 100 lines of failure output
          FAILURE_LOG=$(tail -n 100 pytest_output.log | base64 -w 0)
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Construct payload JSON
          PAYLOAD=$(cat <<EOF
          {
            "event": "workflow_failure",
            "repo": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$TIMESTAMP",
            "log_base64": "$FAILURE_LOG"
          }
          EOF
          )
          
          # Compute HMAC SHA256 Signature
          SIGNATURE=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$FLAKYGUARD_SECRET" | awk '{print $2}')
          
          # Send Webhook to FlakyGuard Incident Intake
          echo "Dispatching HMAC-signed payload (Signature: sha256=$SIGNATURE) to $FLAKYGUARD_URL/api/v1/incidents/investigate"
          curl -s -X POST "$FLAKYGUARD_URL/api/v1/incidents/investigate" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD" || echo "Webhook dispatched (offline/mock environment)"
