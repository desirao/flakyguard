services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flakyguard-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
    volumes:
      - .:/workspace
    profiles:
      - lite
      - full

  redis:
    image: redis:7-alpine
    container_name: flakyguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    profiles:
      - lite
      - full

  postgres:
    image: postgres:16-alpine
    container_name: flakyguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flakyguard_db
      POSTGRES_USER: flakyguard
      POSTGRES_PASSWORD: flakyguard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - lite
      - full

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: flakyguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles:
      - lite
      - full

  sourcegraph:
    image: sourcegraph/server:5.4.0
    container_name: flakyguard-sourcegraph
    restart: unless-stopped
    ports:
      - "7080:7080"
    volumes:
      - sourcegraph_config:/etc/sourcegraph
      - sourcegraph_data:/var/opt/sourcegraph
    profiles:
      - full

  ollama:
    image: ollama/ollama:latest
    container_name: flakyguard-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - full

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  sourcegraph_config:
  sourcegraph_data:
  ollama_data:
